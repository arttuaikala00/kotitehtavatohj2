<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2</title>
</head>
<body>
    <h2>Anna nimesi:</h2>
    <input type="text" id="nimi">
    <button onclick="tervehdi()">Tervehdi</button>
    <p id="tervehdys"></p>

    <script>
        function tervehdi() {
            let nimi = document.getElementById("nimi").value;
            document.getElementById("tervehdys").innerHTML = "Hei, " + nimi;
        }
    </script>
</body>
</html>
